[tool.poetry]
name = "price-prediction-ml"
version = "1.0.0"
description = "ML проект для прогнозирования направления цены"
authors = ["Artur Bashirov"]
readme = "README.md"
packages = [{include = "price_prediction", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.0.0"
numpy = "^1.26.0"
scikit-learn = "^1.3.0"
xgboost = "^2.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
statsmodels = "^0.14.0"
openpyxl = "^3.1.0"
loguru = "^0.7.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
pyyaml = "^6.0.0"
joblib = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.0.0"
mypy = "^1.0.0"
ruff = "^0.3.0"
pre-commit = "^3.0.0"
bandit = "^1.7.0"
detect-secrets = "^1.4.0"
jupyter = "^1.0.0"
ipykernel = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM"]
ignore = ["E501", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["xgboost.*", "seaborn.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/price_prediction --cov-report=term-missing"
