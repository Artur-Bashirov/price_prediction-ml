# Конфигурация проекта Price Prediction

data:
  raw_path: "data/raw/test_ds_1.xlsx"
  date_column: "date"
  target_column: "target"
  decimal_separator: ","

features:
  sma_windows: [5, 20, 50]
  vol_windows: [5, 20]
  rsi_period: 14
  clip_quantiles: [0.01, 0.99]

models:
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    eval_metric: "logloss"
    verbosity: 0

  dummy:
    strategy: "stratified"
    random_state: 42

training:
  train_test_split: 0.8
  cv_folds: 5
  random_state: 42

drift:
  threshold: 0.05
